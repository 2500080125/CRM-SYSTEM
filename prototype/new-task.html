<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PEL | Add task</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="overrides.css"><script src="app.js" defer></script></head>
<body class="feature-page" data-page="tasks.html">
<div class="app-shell">
<aside class="sidebar">
  <div class="brand"><span class="brand-mark">P</span><div><strong>PEL</strong><small>CRM PLATFORM</small></div></div>
  <div class="workspace-label">WORKSPACE</div>
  <nav aria-label="Main navigation"><a class="nav-item" href="index.html"><span>◈</span>Overview</a><a class="nav-item" href="customers.html"><span>♙</span>Customers</a><a class="nav-item" href="pipeline.html"><span>◫</span>Pipeline</a><a class="nav-item active" href="tasks.html"><span>✓</span>Tasks<b data-task-badge hidden>0</b></a><a class="nav-item" href="analytics.html"><span>◒</span>Analytics</a></nav>
  <div class="sidebar-bottom"><a class="nav-item" href="settings.html"><span>⚙</span>Settings</a><button class="user" type="button" id="sidebar-profile" aria-label="Open profile menu"><span class="avatar">SC</span><span class="user-copy"><strong data-user-name>Eswar Charan</strong><small>Administrator</small></span><span class="chevron">⌄</span></button></div>
</aside>
<main class="main">
  <header class="topbar"><div><div class="eyebrow" id="today-label"></div><h1>Add task</h1></div><div class="top-actions"><button class="icon-button" id="global-search-button" aria-label="Search">⌕</button><button class="icon-button" id="notification-button" aria-label="Notifications">♧</button><button class="profile-button" id="profile-button" aria-label="Open profile menu"><span class="avatar small">SC</span><span data-short-name>Eswar</span><span>⌄</span></button></div></header>
  <section class="hero-row"><div><p class="section-kicker">FOLLOW-UP</p><h2>Add task</h2><p class="muted">Create a follow-up that appears on the Tasks page.</p></div></section>
  <form class="panel record-form" id="task-form"><label for="task-title">Task title</label><input id="task-title" name="title" required><label for="task-date">Due date</label><input id="task-date" name="due" type="date"><label for="task-priority">Priority</label><select id="task-priority" name="priority"><option>Medium</option><option>High</option><option>Low</option></select><label for="task-notes">Notes</label><textarea id="task-notes" name="notes" rows="4"></textarea><label for="task-attachment">Attachment preview</label><input id="task-attachment" name="attachment" type="file"><div class="form-actions"><a href="tasks.html" class="secondary">Cancel</a><button class="primary" type="submit">Save task</button></div></form>
</main></div>
<div class="search-popover" id="search-popover"><label for="global-search">Search your records</label><input id="global-search" type="search" placeholder="Customer, deal or task"><div id="global-results"></div></div>
<div class="notification-popover" id="notification-popover"><strong>Notifications</strong><button id="close-notifications" class="popover-close" aria-label="Close notifications">×</button><div id="notification-results"></div></div>
<div class="js-menu profile-menu" id="profile-menu"><strong data-user-name>Eswar Charan</strong><small>Administrator</small><a href="settings.html">My profile</a><button id="logout" class="text-button" type="button">Log out</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body></html>
